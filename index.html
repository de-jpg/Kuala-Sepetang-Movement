<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十八丁 — Kuala Sepetang After Dark</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap');

  :root{
    --ink:#0c0f10;
    --panel:#14181a;
    --line:#e7e2d3;
    --line-dim:rgba(231,226,211,0.16);
    --muted:#8b9296;
    --religious:#c9a03e;
    --dining:#d9663d;
    --recreation:#4f9d8a;
    --informal:#6f8fb0;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--line);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }

  #app{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; }

  header{
    padding:22px 28px 14px; flex:0 0 auto;
    display:flex; align-items:baseline; justify-content:space-between; gap:20px;
    border-bottom:1px solid var(--line-dim); z-index:5;
  }
  header h1{ font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin:0; color:var(--line); }
  header h1 span{ color:var(--muted); font-weight:300; font-style:italic; font-size:16px; margin-left:10px; }
  header p{ margin:0; font-size:12.5px; color:var(--muted); max-width:340px; line-height:1.5; text-align:right; }

  main{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }

  #map-wrap{
    position:absolute; inset:0;
    overflow:auto;
    display:flex; align-items:flex-start; justify-content:center;
  }

  #stage{ position:relative; }

  #basemap{
    display:block;
    filter:invert(0.95) hue-rotate(180deg) brightness(0.82) contrast(1.15);
    opacity:0.9;
  }

  svg#overlay{ position:absolute; top:0; left:0; pointer-events:none; }

  .flow{ fill:none; stroke-linecap:round; opacity:0.32; }
  .flow-pulse{ fill:none; stroke-linecap:round; opacity:0.95; }
  .ring{ fill:none; stroke-linecap:round; }

  .node-label{
    font-family:'Inter',sans-serif; font-size:12px; fill:var(--line);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    paint-order:stroke; stroke:var(--ink); stroke-width:3px;
  }
  .node-dot{ cursor:pointer; pointer-events:all; }
  .node-hit{ pointer-events:all; cursor:pointer; }
  .node-hit:hover + .node-label{ opacity:1; }

  .layer{ transition:opacity .5s ease; }
  .layer.off{ opacity:0; }

  footer{
    flex:0 0 auto; padding:16px 24px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:18px;
    border-top:1px solid var(--line-dim); z-index:5; flex-wrap:wrap;
  }
  .cats{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-btn{
    appearance:none; border:1px solid var(--line-dim); background:transparent; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:12.5px; padding:8px 14px; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .cat-btn .swatch{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .cat-btn[data-cat="religious"] .swatch{ background:var(--religious); }
  .cat-btn[data-cat="dining"] .swatch{ background:var(--dining); }
  .cat-btn[data-cat="recreation"] .swatch{ background:var(--recreation); }
  .cat-btn[data-cat="informal"] .swatch{ background:var(--informal); }
  .cat-btn.active{ color:var(--line); background:rgba(255,255,255,0.04); }
  .cat-btn[data-cat="religious"].active{ border-color:var(--religious); }
  .cat-btn[data-cat="dining"].active{ border-color:var(--dining); }
  .cat-btn[data-cat="recreation"].active{ border-color:var(--recreation); }
  .cat-btn[data-cat="informal"].active{ border-color:var(--informal); }
  .cat-btn[data-cat="all"].active{ border-color:var(--line); color:var(--line); }

  .tools{ display:flex; gap:8px; align-items:center; }
  .tool-btn{
    appearance:none; border:1px solid var(--line-dim); background:transparent; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:12px; padding:8px 12px; border-radius:3px; cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .tool-btn:hover{ color:var(--line); border-color:var(--line); }
  .tool-btn:disabled{ opacity:0.4; cursor:default; }
  #gif-status{ font-size:11px; color:var(--muted); min-width:120px; }

  @media (max-width:720px){
    header{ flex-direction:column; align-items:flex-start; gap:6px; }
    header p{ text-align:left; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>十八丁 <span>Kuala Sepetang, after dark</span></h1>
    <p>Simulated foot traffic across a fishing town — where people worship, eat, play and simply stand around — drawn over the actual site plan of Port Weld.</p>
  </header>

  <main>
    <div id="map-wrap">
      <div id="stage">
        <img id="basemap" src="map.png" alt="Kuala Sepetang site plan">
        <svg id="overlay">
          <defs>
            <radialGradient id="glow-religious" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#c9a03e" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#c9a03e" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="glow-dining" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#d9663d" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#d9663d" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="glow-recreation" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#4f9d8a" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#4f9d8a" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="glow-informal" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#6f8fb0" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#6f8fb0" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="layer-religious" class="layer off" data-cat="religious"></g>
          <g id="layer-dining" class="layer off" data-cat="dining"></g>
          <g id="layer-recreation" class="layer off" data-cat="recreation"></g>
          <g id="layer-informal" class="layer off" data-cat="informal"></g>
        </svg>
      </div>
    </div>
  </main>

  <footer>
    <div class="cats">
      <button class="cat-btn" data-cat="religious"><span class="swatch"></span>Worship</button>
      <button class="cat-btn" data-cat="dining"><span class="swatch"></span>Night dining</button>
      <button class="cat-btn" data-cat="recreation"><span class="swatch"></span>Recreation</button>
      <button class="cat-btn" data-cat="informal"><span class="swatch"></span>Informal</button>
      <button class="cat-btn" data-cat="all"><span class="swatch" style="background:var(--line)"></span>All together</button>
    </div>
    <div class="tools">
      <span id="gif-status"></span>
      <button class="tool-btn" id="shuffle-btn">Reshuffle informal spots</button>
      <button class="tool-btn" id="gif-btn">Download loop as GIF</button>
    </div>
  </footer>

</div>

<script>
(function(){

  const svgNS = 'http://www.w3.org/2000/svg';
  const img = document.getElementById('basemap');
  const svg = document.getElementById('overlay');

  // Fallback data, used only if points.json can't be fetched (e.g. this
  // file was opened directly instead of served — GitHub Pages will fetch
  // points.json fine). Edit points.json (or use editor.html) instead of
  // editing this block.
  const fallbackData = {
    religious: [
      {name:'Kuil Xianfa Shingong', x:655, y:50, weight:3},
      {name:'Turtle Temple', x:150, y:320, weight:2},
      {name:'Kuil Heng Thiam Seng Tee', x:230, y:470, weight:2},
      {name:'Masjid Al-Hadhari', x:900, y:290, weight:3}
    ],
    dining: [
      {name:'Xin Seafood Restaurant', x:460, y:560, weight:3},
      {name:'Mee Udang Warisan', x:1000, y:420, weight:3}
    ],
    recreation: [
      {name:'Port Weld Basketball Court', x:490, y:410, weight:3}
    ],
    informal: [
      {name:'chairs outside a house', x:300, y:550, weight:1}
    ]
  };

  let seedData = null; // as loaded from points.json
  let informalNodes = [];
  const animatedLines = [];

  function jitterAround(node, radius){
    return {
      name: node.name, weight: node.weight,
      x: node.x + (Math.random()-0.5)*radius*2,
      y: node.y + (Math.random()-0.5)*radius*2
    };
  }

  function refreshInformal(){
    const seeds = (seedData.informal && seedData.informal.length) ? seedData.informal : [];
    informalNodes = seeds.map(s => jitterAround(s, 45));
  }

  function clearLayer(g){ while(g.firstChild) g.removeChild(g.firstChild); }

  function curvedPath(x1,y1,x2,y2){
    const mx = (x1+x2)/2 + (Math.random()-0.5)*50;
    const my = (y1+y2)/2 + (Math.random()-0.5)*50;
    return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
  }

  // flow origins are jittered locally around each node — a stand-in for
  // "people arriving from the surrounding streets" without needing a
  // hand-traced road graph.
  function localOrigins(node, count){
    const pts = [];
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*130;
      pts.push([ node.x + Math.cos(angle)*dist, node.y + Math.sin(angle)*dist ]);
    }
    return pts;
  }

  // weight tiers -> size: busiest (3) biggest, moderate (2) noticeably
  // smaller, quiet (1) smallest. Keeps a clear visual hierarchy instead of
  // a flat linear bump.
  function nodeRadius(weight){
    if(weight>=3) return 11;
    if(weight===2) return 7.5;
    return 4.5;
  }

  function drawCategory(g, colorVar, glowUrl, nodes){
    clearLayer(g);
    nodes.forEach(node=>{
      const originCount = 5 + node.weight*4;
      const origins = localOrigins(node, originCount);
      const baseR = nodeRadius(node.weight);

      const glow = document.createElementNS(svgNS,'circle');
      glow.setAttribute('cx', node.x); glow.setAttribute('cy', node.y);
      glow.setAttribute('r', baseR*3.4);
      glow.setAttribute('fill', glowUrl);
      g.appendChild(glow);

      origins.forEach(o=>{
        const [ox,oy] = o;
        const d = curvedPath(ox,oy,node.x,node.y);

        // solid base line, always fully drawn and dim
        const base = document.createElementNS(svgNS,'path');
        base.setAttribute('d', d);
        base.setAttribute('class','flow');
        base.setAttribute('stroke', colorVar);
        base.setAttribute('stroke-width', (0.5 + Math.random()*0.5).toFixed(2));
        g.appendChild(base);

        // pulse: a short, thicker segment travelling along the same solid line
        const pulse = document.createElementNS(svgNS,'path');
        pulse.setAttribute('d', d);
        pulse.setAttribute('class','flow-pulse');
        pulse.setAttribute('stroke', colorVar);
        pulse.setAttribute('stroke-width', (1.6 + Math.random()*1.2).toFixed(2));
        g.appendChild(pulse);

        requestAnimationFrame(()=>{
          const len = pulse.getTotalLength();
          const dash = Math.max(14, len*0.08);
          pulse.setAttribute('stroke-dasharray', dash + ',' + (len-dash));
          animatedLines.push({ el: pulse, len, speed: 18+Math.random()*22, phase: Math.random()*len });
        });
      });

      for(let r=0;r<node.weight+1;r++){
        const ring = document.createElementNS(svgNS,'circle');
        ring.setAttribute('cx', node.x); ring.setAttribute('cy', node.y);
        ring.setAttribute('r', baseR + r*(baseR*0.55));
        ring.setAttribute('class','ring');
        ring.setAttribute('stroke', colorVar);
        ring.setAttribute('stroke-width', 1);
        ring.setAttribute('opacity', (0.6 - r*0.12).toFixed(2));
        g.appendChild(ring);
      }

      const dot = document.createElementNS(svgNS,'circle');
      dot.setAttribute('cx', node.x); dot.setAttribute('cy', node.y);
      dot.setAttribute('r', baseR*0.55);
      dot.setAttribute('fill', colorVar);
      dot.setAttribute('class','node-dot');
      g.appendChild(dot);

      const hit = document.createElementNS(svgNS,'circle');
      hit.setAttribute('cx', node.x); hit.setAttribute('cy', node.y);
      hit.setAttribute('r', baseR + 8);
      hit.setAttribute('fill','transparent');
      hit.setAttribute('class','node-hit');
      g.appendChild(hit);

      const label = document.createElementNS(svgNS,'text');
      label.setAttribute('x', node.x+9); label.setAttribute('y', node.y-9);
      label.setAttribute('class','node-label');
      label.textContent = node.name;
      g.appendChild(label);
    });
  }

  function renderAll(){
    animatedLines.length = 0;
    drawCategory(document.getElementById('layer-religious'), 'var(--religious)', 'url(#glow-religious)', seedData.religious || []);
    drawCategory(document.getElementById('layer-dining'), 'var(--dining)', 'url(#glow-dining)', seedData.dining || []);
    drawCategory(document.getElementById('layer-recreation'), 'var(--recreation)', 'url(#glow-recreation)', seedData.recreation || []);
    drawCategory(document.getElementById('layer-informal'), 'var(--informal)', 'url(#glow-informal)', informalNodes);
  }

  function applyAnimationAt(tSeconds){
    animatedLines.forEach(line=>{
      const offset = (line.phase - tSeconds*line.speed) % line.len;
      line.el.setAttribute('stroke-dashoffset', offset);
    });
  }

  let rafId = null, liveStart = performance.now();
  function liveTick(now){ applyAnimationAt((now-liveStart)/1000); rafId = requestAnimationFrame(liveTick); }

  // ---- toggling ----
  const layerIds = {religious:'layer-religious', dining:'layer-dining', recreation:'layer-recreation', informal:'layer-informal'};
  const activeCats = new Set();
  const buttons = Array.from(document.querySelectorAll('.cat-btn'));
  function syncLayers(){
    Object.keys(layerIds).forEach(cat=>{
      document.getElementById(layerIds[cat]).classList.toggle('off', !activeCats.has(cat));
    });
    buttons.forEach(b=>{
      const cat = b.dataset.cat;
      b.classList.toggle('active', cat==='all' ? activeCats.size===4 : activeCats.has(cat));
    });
  }
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.cat;
      if(cat==='all'){
        if(activeCats.size===4) activeCats.clear();
        else Object.keys(layerIds).forEach(c=>activeCats.add(c));
      } else {
        if(activeCats.has(cat)) activeCats.delete(cat); else activeCats.add(cat);
      }
      syncLayers();
    });
  });

  document.getElementById('shuffle-btn').addEventListener('click', ()=>{
    refreshInformal();
    renderAll();
    syncLayers();
  });

  function sizeOverlay(){
    svg.setAttribute('width', img.naturalWidth);
    svg.setAttribute('height', img.naturalHeight);
    svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
  }

  function boot(){
    sizeOverlay();
    refreshInformal();
    renderAll();
    activeCats.add('religious'); activeCats.add('dining');
    syncLayers();
    rafId = requestAnimationFrame(liveTick);
  }

  fetch('points.json').then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
    .then(json=>{ seedData = json; })
    .catch(()=>{ seedData = fallbackData; })
    .finally(()=>{
      if(img.complete && img.naturalWidth) boot();
      else img.addEventListener('load', boot, {once:true});
    });

  // ---- GIF export (same approach as before, now rasterising the
  // real basemap + overlay together) ----
  const gifBtn = document.getElementById('gif-btn');
  const gifStatus = document.getElementById('gif-status');
  let gifLibLoading = null;
  function loadGifLib(){
    if(window.GIF) return Promise.resolve();
    if(gifLibLoading) return gifLibLoading;
    gifLibLoading = new Promise((resolve,reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
      s.onload = resolve;
      s.onerror = ()=>reject(new Error('gif.js failed to load'));
      document.head.appendChild(s);
    });
    return gifLibLoading;
  }

  function frameToImage(width, height){
    return new Promise((resolve,reject)=>{
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', svgNS);
      const xml = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);
      const svgImg = new Image();
      svgImg.onload = ()=>{ URL.revokeObjectURL(url); resolve(svgImg); };
      svgImg.onerror = reject;
      svgImg.src = url;
    });
  }

  gifBtn.addEventListener('click', async ()=>{
    gifBtn.disabled = true;
    gifStatus.textContent = 'loading encoder…';
    try{ await loadGifLib(); }
    catch(e){
      gifStatus.textContent = 'no internet — host on GitHub Pages first.';
      gifBtn.disabled = false; return;
    }

    cancelAnimationFrame(rafId);

    const W = 900, H = Math.round(900 * img.naturalHeight / img.naturalWidth);
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const gif = new GIF({
      workers: 2, quality: 8, width: W, height: H,
      workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
    });

    const frameCount = 24, loopSeconds = 2.4, dt = loopSeconds/frameCount;

    for(let i=0;i<frameCount;i++){
      applyAnimationAt(i*dt);
      gifStatus.textContent = `rendering frame ${i+1}/${frameCount}…`;
      const overlayImg = await frameToImage(W,H);
      ctx.clearRect(0,0,W,H);
      ctx.filter = 'invert(0.95) hue-rotate(180deg) brightness(0.82) contrast(1.15)';
      ctx.drawImage(img, 0,0,W,H);
      ctx.filter = 'none';
      ctx.drawImage(overlayImg, 0,0,W,H);
      gif.addFrame(ctx, {copy:true, delay: dt*1000});
    }

    gif.on('finished', function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'kuala-sepetang-gathering-flows.gif'; a.click();
      gifStatus.textContent = 'done — check your downloads.';
      gifBtn.disabled = false;
      liveStart = performance.now();
      rafId = requestAnimationFrame(liveTick);
    });

    gifStatus.textContent = 'encoding…';
    gif.render();
  });

})();
</script>
</body>
</html>
